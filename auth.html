<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | 登入驗證</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .login-form {
            padding: 30px 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-button {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 12px;
        }

        .password-hints {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .password-hints h4 {
            color: #374151;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .password-hints ul {
            list-style: none;
            font-size: 12px;
            color: #6b7280;
        }

        .password-hints li {
            margin-bottom: 4px;
            padding-left: 16px;
            position: relative;
        }

        .password-hints li:before {
            content: "•";
            color: #9ca3af;
            position: absolute;
            left: 0;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 安全驗證</h1>
            <p>Cullinan30a 項目存取控制</p>
        </div>

        <div class="login-form">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="password">輸入存取密碼</label>
                    <input type="password" id="password" class="form-input" placeholder="請輸入密碼..." required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="login-button">
                    登入存取
                </button>
            </form>

            <div class="password-hints">
                <h4>📝 提示信息</h4>
                <ul>
                    <li>使用預設密碼之一進行存取</li>
                    <li>登入成功後可存取 24 小時</li>
                    <li>支援多個專案存取密碼</li>
                    <li>安全連線保護您的資料</li>
                </ul>
            </div>

            <div class="footer">
                Cullinan30a Project v6.12 | Updated: 2025-08-22 | 2025-08-16<br>
                Protected by authentication system
            </div>
        </div>
    </div>

    <script>
        // Valid passwords
        const validPasswords = [
            'cullinan2025',
            'voice6.8',
            'apps-script-access',
            'facepack-dashboard',
            'auth-protection-2025'
        ];

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loginContainer = document.querySelector('.login-container');

        // Check if already authenticated
        function checkExistingAuth() {
            const isAuthenticated = sessionStorage.getItem('cullinan30a_session') === 'true';
            const authToken = localStorage.getItem('cullinan30a_auth');

            if (isAuthenticated && authToken) {
                try {
                    const decoded = atob(authToken).split('_');
                    const timestamp = parseInt(decoded[1], 10);
                    const expiry = 24 * 60 * 60 * 1000; // 24 hours

                    if (Date.now() - timestamp < expiry) {
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (e) {
                    // Invalid token, continue to login
                }
            }

            // Clear invalid tokens
            localStorage.removeItem('cullinan30a_auth');
            sessionStorage.removeItem('cullinan30a_session');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';

            loginContainer.classList.add('shake');
            setTimeout(() => {
                loginContainer.classList.remove('shake');
            }, 500);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function generateToken(password) {
            const timestamp = Date.now();
            const hash = btoa(`${password}_${timestamp}`);
            return hash;
        }

        function authenticate(password) {
            if (validPasswords.includes(password)) {
                const token = generateToken(password);

                // Store authentication
                localStorage.setItem('cullinan30a_auth', token);
                sessionStorage.setItem('cullinan30a_session', 'true');

                showSuccess('✅ 驗證成功！正在跳轉...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

                return true;
            }
            return false;
        }

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const password = passwordInput.value.trim();

            if (!password) {
                showError('❌ 請輸入密碼');
                return;
            }

            if (authenticate(password)) {
                // Success handled in authenticate function
            } else {
                showError('❌ 密碼錯誤，請重新輸入');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // Focus password input on load
        window.addEventListener('load', () => {
            checkExistingAuth();
            passwordInput.focus();
        });

        // Handle Enter key
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>

</html>
