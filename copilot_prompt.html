<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Replacer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    select, input, button {
      margin: 10px 0;
      padding: 8px;
      font-size: 16px;
    }
    #output {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Word Replacer Tool</h2>
  
  <label for="wordSelect">Choose a word:</label>
  <select id="wordSelect">
    <option value="About">About</option>
    <option value="Info">Info</option>
    <option value="Details">Details</option>
    <option value="Overview">Overview</option>
  </select>
  
  <br>
  
  <label for="customWord">Or enter custom word:</label>
  <input type="text" id="customWord" placeholder="Type your own word">
  
  <br>
  
  <button onclick="generateText()">Generate</button>
  <button onclick="copyText()">Copy to Clipboard</button>
  
  <br>
  
  <textarea id="output" readonly placeholder="Your text will appear here..."></textarea>
  
  <script>
    function generateText() {
      const dropdown = document.getElementById("wordSelect");
      const custom = document.getElementById("customWord").value.trim();
      const chosenWord = custom !== "" ? custom : dropdown.value;
      
      const text = `This page is all ${chosenWord}. Please explore for more ${chosenWord}.`;
      document.getElementById("output").value = text;
    }
    
    function copyText() {
      const output = document.getElementById("output");
      output.select();
      output.setSelectionRange(0, 99999); // for mobile support
      navigator.clipboard.writeText(output.value)
        .then(() => alert("Copied to clipboard!"))
        .catch(err => alert("Failed to copy: " + err));
    }
  </script>
</body>
</html>
