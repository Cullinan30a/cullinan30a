<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Index | 專案索引</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    .page-list {
      list-style-type: disc;
      padding-left: 20px;
      margin: 20px 0;
    }
    .page-item {
      margin: 15px 0;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .page-item:hover {
      background-color: #e9e9e9;
      border-color: #ccc;
    }
    .page-title {
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Website Pages Index | 網站頁面索引</h2>
  <p>Select a page to visit: | 選擇要訪問的頁面：</p>
  
  <ul id="pageList" class="page-list">
    <!-- Page items will be added by JavaScript -->
  </ul>
  
  <script>
    // Define your HTML pages here
    const pages = [
      { title: "AI Prompt Generator | AI 提示生成器", file: "ai_prompt_generator.html" },
      { title: "Copilot Prompt Helper | Copilot 提示助手", file: "copilot_prompt.html" },
      { title: "Website Cloner | 網站複製工具", file: "weblink_cloner.html" }
    ];

    const pageList = document.getElementById("pageList");

    // Create bullet point list items
    pages.forEach(page => {
      const listItem = document.createElement("li");
      listItem.className = "page-item";
      listItem.innerHTML = `<span class="page-title">${page.title}</span>`;
      listItem.onclick = () => {
        window.location.href = page.file;
      };
      pageList.appendChild(listItem);
    });
  </script>
</body>
</html>
