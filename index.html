<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Index | 專案索引</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    .page-list {
      list-style-type: disc;
      padding-left: 20px;
      margin: 20px 0;
    }
    .page-item {
      margin: 15px 0;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .page-item:hover {
      background-color: #e9e9e9;
      border-color: #ccc;
    }
    .page-title {
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }
    .user-links {
      margin-top: 30px;
    }
    .user-links h3 {
      color: #666;
      border-bottom: 2px solid #007bff;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .user-link-item {
      margin: 15px 0;
      padding: 10px 15px;
      border: 1px solid #007bff;
      border-radius: 5px;
      background-color: #f8f9ff;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .user-link-item:hover {
      background-color: #e9ecff;
      border-color: #0056b3;
    }
    .add-link-btn {
      margin: 20px 0;
      padding: 12px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background-color 0.3s;
    }
    .add-link-btn:hover {
      background-color: #218838;
    }
    .status-bar {
      text-align: center;
      background-color: #f0f0f0;
      padding: 5px 0;
      font-size: 14px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="status-bar">v6.2 | Updated: 2025-08-10 20:30 (GMT+8) | Added ABC Drive viewer</div>
  <h2>Website Pages Index | 網站頁面索引</h2>
  <p>Select a page to visit: | 選擇要訪問的頁面：</p>
  
  <ul id="pageList" class="page-list">
    <!-- Page items will be added by JavaScript -->
  </ul>
  
  <button class="add-link-btn" onclick="window.location.href='add_link.html'">
    + Add New Website Link | + 添加新網站連結
  </button>
  
  <div class="user-links" id="userLinksSection" style="display: none;">
    <h3>Your Added Links | 您添加的連結</h3>
    <ul id="userLinksList" class="page-list">
      <!-- User added links will appear here -->
    </ul>
  </div>
  
  <script>
    // Define your HTML pages here
    const pages = [
      { title: "AI Prompt Generator | AI 提示生成器", file: "ai_prompt_generator.html" },
      { title: "Copilot Prompt Helper | Copilot 提示助手", file: "copilot_prompt.html" },
      { title: "Website Cloner | 網站複製工具", file: "weblink_cloner.html" },
      { title: "ABC Drive Viewer | ABC 雲端硬碟檢視器", file: "abc.html" }
    ];

    const pageList = document.getElementById("pageList");

    // Create bullet point list items for built-in pages
    pages.forEach(page => {
      const listItem = document.createElement("li");
      listItem.className = "page-item";
      listItem.innerHTML = `<span class="page-title">${page.title}</span>`;
      listItem.onclick = () => {
        window.location.href = page.file;
      };
      pageList.appendChild(listItem);
    });
    
    // Load and display user-added links
    function loadUserLinks() {
      const savedLinks = JSON.parse(localStorage.getItem('websiteLinks') || '[]');
      const userLinksSection = document.getElementById('userLinksSection');
      const userLinksList = document.getElementById('userLinksList');
      
      if (savedLinks.length > 0) {
        userLinksSection.style.display = 'block';
        userLinksList.innerHTML = '';
        
        savedLinks.forEach(link => {
          const listItem = document.createElement("li");
          listItem.className = "user-link-item";
          listItem.innerHTML = `<span class="page-title">${escapeHtml(link.title)}</span>`;
          listItem.onclick = () => {
            window.open(link.url, '_blank');
          };
          userLinksList.appendChild(listItem);
        });
      } else {
        userLinksSection.style.display = 'none';
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Load user links on page load
    loadUserLinks();
    
    // Listen for storage changes (when links are added/removed)
    window.addEventListener('storage', function(e) {
      if (e.key === 'websiteLinks') {
        loadUserLinks();
      }
    });
    
    // Also listen for custom events from the add_link page
    window.addEventListener('linksUpdated', function() {
      loadUserLinks();
    });
  </script>
</body>
</html>
