<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<!--
  GAS webhook config is now loaded from environment variables for frontend security.
  See .env and .gitignore for details.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatGPT Drive Console</title>
<style>
  :root{--bg:#0b0f14;--card:#121821;--ink:#e6edf3;--muted:#9fb0c0;--accent:#3aa3ff;--accent-2:#21d19f;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial;}
  .wrap{max-width:1100px;margin:0 auto;padding:24px;}
  .grid{display:grid;grid-template-columns:1fr 380px;gap:16px;}
  .card{background:var(--card);border:1px solid #1f2835;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.35)}
  .head{padding:18px 20px;border-bottom:1px solid #1f2835;font-weight:700}
  .body{padding:16px 20px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .row > *{flex:1}
  input,select,textarea{width:100%;background:#0f141c;border:1px solid #233043;color:var(--ink);padding:10px 12px;border-radius:12px}
  textarea{min-height:180px;font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace}
  button{background:var(--accent);border:0;color:#001428;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
  button.secondary{background:#1f2835;color:var(--ink)}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .hide{display:none}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#182231;color:var(--muted);font-size:12px;margin-right:6px}
  .ok{color:var(--accent-2);font-weight:700}
  .danger{color:#ff6b6b;font-weight:700}
  .hr{height:1px;background:#1f2835;margin:12px 0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <!-- Only one main UI block should remain here. -->
      <!-- ...existing code for one console window... -->
    </div>
  </div>

<script>
(function(){
  // Preset test values
  const TEST_PASSCODE = 'nucsup-vunset-4hyhnl';
  const TEST_FOLDERID = '<GOOGLE_DRIVE_FOLDER_ID_Inbox>';

  $('preset').addEventListener('click', () => {
    $('passcode').value = TEST_PASSCODE;
    if ($('folderId')) $('folderId').value = TEST_FOLDERID;
    if ($('folder')) $('folder').value = TEST_FOLDERID;
    if ($('folder2')) $('folder2').value = TEST_FOLDERID;
  });
  const $ = (id)=>document.getElementById(id);
  const sections = [
    'version_bump','upload_from_url','upload_base64','list','update','backup','move','delete',
    'getvoicecontent','savevoicecontent','listversionhistory'
  ];

  function setFields(){
    sections.forEach(s=>{ const el=$('fld-'+s); if(el) el.classList.add('hide'); });
    const act = $('action').value;
    const has = $('fld-'+act);
    if (has) has.classList.remove('hide');
  }

  $('action').addEventListener('change', setFields);
  setFields();

  $('reset').addEventListener('click', ()=>{
    $('output').value='';
  });

  $('run').addEventListener('click', ()=>{
    const action = $('action').value;
    const passcode = $('passcode').value || '';
    const p = { action, passcode };

    if (action==='version_bump') p.inc = $('inc').value;
    if (action==='upload_from_url'){
      p.url=$('url').value;
      p.folder=$('folder').value || TEST_FOLDERID;
      p.name=$('name').value;
    }
    if (action==='upload_base64'){
      p.base64=$('base64').value;
      p.folder=$('folder2').value || TEST_FOLDERID;
      p.name=$('name2').value;
      p.__method='POST';
    }
    if (action==='list'){
      p.folderId=$('folderId').value || TEST_FOLDERID;
    }
    if (action==='update'){ p.fileId=$('fileId1').value; p.newName=$('newName').value; }
    if (action==='backup'){ p.fileId=$('fileId2').value; }
    if (action==='move'){ p.fileId=$('fileId3').value; p.targetFolderId=$('targetFolderId').value; }
    if (action==='delete'){ p.fileId=$('fileId4').value; }
    if (action==='getvoicecontent'){ p.version=$('vcVersion').value; }
    if (action==='savevoicecontent'){ p.professional=$('vcPro').value; p.warm=$('vcWarm').value; p.topic=$('vcTopic').value; p.source=$('vcSource').value; }
    if (action==='listversionhistory'){ p.limit=$('vcLimit').value; }

    // If Apps Script, use google.script.run; else, send to webhook via fetch
    if (typeof google !== 'undefined' && google.script && google.script.run){
      google.script.run
        .withSuccessHandler((res)=>{ $('output').value = JSON.stringify(res, null, 2); })
        .withFailureHandler((err)=>{ $('output').value = 'ERROR: '+ (err && err.message ? err.message : String(err)); })
        .serverInvoke(p);
    } else {
      // Send POST request to webhook endpoint and display response
      const endpoint = (window.WEBHOOK_URL || localStorage.getItem('WEBHOOK_URL') || ($('webapp') ? $('webapp').value : '')).trim();
      if (!endpoint) {
        $('output').value = 'ERROR: Webhook endpoint not set. Please provide the URL.';
        return;
      }
      $('output').value = '⏳ Sending request...';
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(p)
      })
      .then(async res => {
        let text = await res.text();
        try {
          const json = JSON.parse(text);
          $('output').value = JSON.stringify(json, null, 2);
        } catch {
          $('output').value = text;
        }
      })
      .catch(err => {
        $('output').value = 'ERROR: ' + (err && err.message ? err.message : String(err));
      });
    }
  });

  // Re-Run Result button logic
  $('rerun').addEventListener('click', () => {
    const endpoint = (window.WEBHOOK_URL || localStorage.getItem('WEBHOOK_URL') || ($('webapp') ? $('webapp').value : '')).trim();
    if (!endpoint) {
      $('output').value = 'ERROR: Webhook endpoint not set. Please provide the URL.';
      return;
    }
    let data;
    try {
      data = JSON.parse($('output').value);
    } catch {
      $('output').value = 'ERROR: Result is not valid JSON.';
      return;
    }
    $('output').value = '⏳ Re-sending result JSON...';
    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(async res => {
      let text = await res.text();
      try {
        const json = JSON.parse(text);
        $('output').value = JSON.stringify(json, null, 2);
      } catch {
        $('output').value = text;
      }
    })
    .catch(err => {
      $('output').value = 'ERROR: ' + (err && err.message ? err.message : String(err));
    });
  });
})();
</script>
</body>
</html>
