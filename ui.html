<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Webhook Tester | Cullinan30a</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;color:#111;background:#fafafa}
    header{padding:16px 20px;background:#0f172a;color:#fff}
    h1{margin:0;font-size:18px}
    .wrap{max-width:980px;margin:24px auto;padding:0 16px}
    .grid{display:grid;gap:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    label{font-size:12px;color:#334155}
    input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:14px}
    textarea{min-height:160px;resize:vertical}
    button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
    button.ghost{background:#e2e8f0;color:#111}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
    .two{grid-template-columns:1fr 1fr}
    pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#d1e7ff;padding:12px;border-radius:8px;max-height:400px;overflow:auto}
    .muted{color:#64748b;font-size:12px}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}
    .right{margin-left:auto}
  </style>
</head>
<body>
  <header><h1>Webhook Function Tester</h1></header>
  <div class="wrap grid">
    <div class="card grid two">
      <div>
        <label>Webhook Endpoint</label>
        <input id="endpoint" placeholder="https://script.google.com/macros/s/XXXX/exec">
      </div>
      <div>
        <label>Passcode（可留空）</label>
        <input id="passcode" placeholder="••••••••">
      </div>
    </div>

    <div class="card grid two">
      <div>
        <label>Action（可留空）</label>
        <input id="action" placeholder="savevoicecontent 或其他">
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Method</label>
          <select id="method">
            <option>POST</option>
            <option>GET</option>
          </select>
        </div>
        <div class="row" style="align-items:center;gap:12px">
          <label class="muted"><input type="checkbox" id="remember"> 記住 endpoint / passcode</label>
        </div>
      </div>
    </div>

    <div class="card grid">
      <label>JSON Payload（POST 會用到；GET 會忽略此欄）</label>
      <textarea id="payload" spellcheck="false">{
  "demo": "hello",
  "timestamp": "{NOW}"
}</textarea>
      <div class="row">
        <button id="run">Run Test</button>
        <button class="ghost" id="clearResp">Clear Response</button>
        <span class="badge" id="envBadge">環境：使用輸入欄數值</span>
        <span class="right muted">結果見下方 Response / Activity Log</span>
      </div>
    </div>

    <div class="card grid two">
      <div>
        <label>Response</label>
        <pre id="response">Results will appear here...</pre>
      </div>
      <div>
        <div class="row" style="margin-bottom:8px">
          <label>Activity Log</label>
          <div class="right">
            <button class="ghost" id="exportLog">Export</button>
            <button class="ghost" id="clearLog">Clear</button>
          </div>
        </div>
        <pre id="log">Activity log will appear here...</pre>
      </div>
    </div>
  </div>

  <script>
    const qs = s => document.querySelector(s);
    const endpointEl = qs('#endpoint');
    const passcodeEl = qs('#passcode');
    const actionEl = qs('#action');
    const methodEl = qs('#method');
    const payloadEl = qs('#payload');
    const rememberEl = qs('#remember');
    const responseEl = qs('#response');
    const logEl = qs('#log');
    const envBadge = qs('#envBadge');
    const runBtn = qs('#run');
    const clearRespBtn = qs('#clearResp');
    const clearLogBtn = qs('#clearLog');
    const exportLogBtn = qs('#exportLog');

    const LS_KEYS = {ep:'wt_endpoint', pc:'wt_passcode', ac:'wt_action'};
    function now(){ return new Date().toISOString(); }
    function addLog(msg){ logEl.textContent += `[${now()}] ${msg}\n`; logEl.scrollTop = logEl.scrollHeight; }
    function saveIfNeeded(){
      if(!rememberEl.checked) return;
      localStorage.setItem(LS_KEYS.ep, endpointEl.value||'');
      localStorage.setItem(LS_KEYS.pc, passcodeEl.value||'');
      localStorage.setItem(LS_KEYS.ac, actionEl.value||'');
    }
    function loadFromLS(){
      const ep = localStorage.getItem(LS_KEYS.ep)||'';
      const pc = localStorage.getItem(LS_KEYS.pc)||'';
      const ac = localStorage.getItem(LS_KEYS.ac)||'';
      if(ep) endpointEl.value = ep;
      if(pc) passcodeEl.value = pc;
      if(ac) actionEl.value = ac;
      rememberEl.checked = !!ep || !!pc || !!ac;
    }
    function fmtJSON(text){
      try{ return JSON.stringify(JSON.parse(text), null, 2); }catch(e){ return text; }
    }
    function injectNow(text){
      return text.replaceAll('{NOW}', now());
    }
    async function run(){
      const endpoint = (endpointEl.value||'').trim();
      if(!endpoint){ responseEl.textContent = '❌ 請輸入 Webhook Endpoint'; return; }
      const method = methodEl.value;
      const params = new URLSearchParams();
      if(actionEl.value) params.append('action', actionEl.value);
      if(passcodeEl.value) params.append('passcode', passcodeEl.value);
      let url = endpoint;
      const isGET = method === 'GET';
      let body = null;

      if(isGET){
        const qsChar = url.includes('?') ? '&' : '?';
        url = url + (params.toString() ? qsChar + params.toString() : '');
      }else{
        const payload = injectNow(payloadEl.value||'{}');
        body = payload;
        if(params.toString()){
          const qsChar = url.includes('?') ? '&' : '?';
          url = url + qsChar + params.toString();
        }
      }

      addLog(`→ ${method} ${url}`);
      saveIfNeeded();
      try{
        const res = await fetch(url, {
          method,
          headers: isGET ? {} : {'Content-Type':'application/json'},
          body: isGET ? undefined : body
        });
        const text = await res.text();
        let out = text;
        try{ out = JSON.stringify(JSON.parse(text), null, 2); }catch(e){}
        responseEl.textContent = out;
        addLog(`✓ ${res.status} ${res.statusText}`);
      }catch(err){
        responseEl.textContent = `Error: ${err}`;
        addLog(`✗ Error ${err}`);
      }
    }

    runBtn.addEventListener('click', run);
    clearRespBtn.addEventListener('click', ()=> responseEl.textContent = 'Results will appear here...');
    clearLogBtn.addEventListener('click', ()=> logEl.textContent = '');
    exportLogBtn.addEventListener('click', ()=>{
      const blob = new Blob([logEl.textContent], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `webhook_tester_log_${Date.now()}.txt`;
      a.click();
    });

    loadFromLS();
    addLog('Ready.');
  </script>
</body>
</html>
