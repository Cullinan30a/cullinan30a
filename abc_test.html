<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Speech Sandbox v6.7 · 兩版本自述稿 · 一鍵語音播放</title>
  <meta name="description" content="兩段內容即貼即播，支援粵語（zh-HK）語音合成、情緒預設、語速音高調整。">
  <style>
    :root { --bg:#0b0f14; --card:#121821; --ink:#eef3ff; --muted:#a7b0c2; --primary:#5cc8ff; --accent:#ffd166; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,PingFang HK,PingFang TC,Helvetica,Arial}
    .wrap{max-width:980px;margin:40px auto;padding:0 16px}
    h1{font-size:1.6rem;margin:0 0 12px}
    .sub{color:var(--muted);margin-bottom:24px}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
    .panel{background:var(--card);border:1px solid #1e2633;border-radius:16px;padding:16px}
    textarea{width:100%;min-height:160px;border-radius:12px;border:1px solid #253045;background:#0e141c;color:var(--ink);padding:12px;line-height:1.6}
    label{display:block;margin-bottom:8px;color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
    button{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;color:#071018;background:var(--primary)}
    button.secondary{background:#263447;color:var(--ink)}
    button.warn{background:var(--accent)}
    select,input[type="range"]{background:#0e141c;color:var(--ink);border:1px solid #253045;border-radius:10px;padding:8px}
    .card{background:linear-gradient(180deg,#141c28,#0f1520);border:1px solid #1f2a3a;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
    .card h3{margin:0 0 4px}
    .scr{white-space:pre-wrap;line-height:1.7;color:#dfe7ff;background:#0b111a;border-radius:12px;padding:12px;border:1px solid #1d2736;max-height:300px;overflow:auto}
    .tag{font-size:.8rem;color:#9fb2cc;border:1px solid #2a3a52;border-radius:999px;padding:4px 10px;display:inline-block}
    .pill{display:inline-flex;gap:8px;align-items:center}
    .muted{color:var(--muted)}
    .banner{position:sticky;top:0;z-index:9999;background:#0b0f14;border-bottom:1px solid #1e2633;padding:8px 12px;display:flex;gap:8px;align-items:center}
    .banner a{color:#5cc8ff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <!-- version: v6.7 (2025-08-14) -->
  <div class="banner">
    <a href="index.html">← 返回首頁</a>
    <span>Speech Sandbox v6.7 · 粵語語音合成</span>
  </div>

  <div class="wrap">
    <h1>🎙 兩版本自述稿 · 一鍵語音播放</h1>
    <div class="sub">貼上內容 ▶ 更新到頁面 ▶ 按播放；可選聲線、語速、音高；支援「專業＋震撼」與「溫暖＋關懷」情緒預設。</div>

    <div class="panel">
      <div class="grid">
        <div>
          <label for="input1">Option 1（專業＋震撼）</label>
          <textarea id="input1">大家好，
今日我想同你分享，
一份真正可以改變生活嘅保障方案。

呢份宏伴護航危疾入息保障，
唔止係一份保險，
佢係一份長期承諾，
畀你同你嘅家人，
面對人生最艱難嘅時候，
都可以堅持落去。

當你遇上癌症，
心臟病，
中風等重大疾病，
唔止醫療費用飆升，
仲有收入中斷嘅壓力。

但係，
呢份保障提供多次賠償，
高達名義金額四倍，
仲可以覆蓋早期危疾，
補足你保障上嘅缺口。

最重要嘅係，
一旦確診嚴重危疾，
保費全免，
保障繼續有效，
冇中斷，
冇後顧之憂。

喺關鍵時刻，
佢係你最堅固嘅盾牌，
守護你嘅收入，
穩定你嘅未來。</textarea>
        </div>
        <div>
          <label for="input2">Option 2（溫暖＋關懷）</label>
          <textarea id="input2">大家好，
今日想同大家傾一傾，
點樣為自己同家人，
加多一份安全感。

我哋永遠唔知，
明天會發生咩事，
可能係一次醫生嘅診斷，
就令到生活同收入，
發生翻天覆地嘅變化。

宏伴護航危疾入息保障，
就係希望喺呢啲時候，
成為你背後嘅支撐。

佢唔單止會喺你患上嚴重疾病時，
提供一次賠償，
仲可以多次索償，
涵蓋癌症，
心臟病，
中風等多種高風險疾病。

如果你需要長時間康復，
保費仲會自動豁免，
保障繼續生效，
唔使擔心中途停止。

因為我知道，
當你專心養好身體嘅時候，
冇咗經濟壓力，
先可以真正安心。

呢份保障，
唔只係保單上嘅條款，
佢係一份真心守護，
令你同家人，
繼續向前。</textarea>
        </div>
      </div>

      <div class="row" style="margin-top:18px">
        <div class="pill"><span class="muted">🎚 聲線</span>
          <select id="voiceSelect"><option>載入中…</option></select>
        </div>
        <div class="pill"><span class="muted">⏱ 語速</span>
          <input id="rate" type="range" min="0.6" max="1.6" step="0.05" value="1.05"/>
        </div>
        <div class="pill"><span class="muted">🎵 音高</span>
          <input id="pitch" type="range" min="0.7" max="1.6" step="0.05" value="1.05"/>
        </div>
        <button id="apply" class="warn">更新到頁面</button>
        <button id="stopAll" class="secondary">■ 全部停止</button>
      </div>
      <div class="row">
        <span class="tag">優先使用 zh‑HK 聲線</span>
        <span class="tag">自動分句：逗號/句號/換行</span>
        <span class="tag">行動觸發才能發聲（瀏覽器限制）</span>
      </div>
    </div>

    <div class="grid" style="margin-top:18px">
      <div class="card">
        <h3>Option 1（專業＋震撼）</h3>
        <div class="row">
          <button id="play1">▶ 播放</button>
          <button id="preset1" class="secondary">⚡ 情緒預設：專業＋震撼</button>
          <button id="copy1" class="secondary">⧉ 複製全文</button>
        </div>
        <div id="out1" class="scr"></div>
      </div>
      <div class="card">
        <h3>Option 2（溫暖＋關懷）</h3>
        <div class="row">
          <button id="play2">▶ 播放</button>
          <button id="preset2" class="secondary">💛 情緒預設：溫暖＋關懷</button>
          <button id="copy2" class="secondary">⧉ 複製全文</button>
        </div>
        <div id="out2" class="scr"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const voicesState = { voices: [] };

    function splitIntoChunks(text) {
      return text
        .split(/(?<=[，、。！？\n])/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function populateVoices() {
      const select = $('#voiceSelect');
      const all = speechSynthesis.getVoices();
      voicesState.voices = all;

      const preferred = all.filter(v =>
        /zh/i.test(v.lang) && /(HK|Hant)/i.test(v.lang) || /yue|canton/i.test(v.name)
      );

      const list = preferred.length ? preferred : all;
      select.innerHTML = '';
      list.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name}  ·  ${v.lang}`;
        select.appendChild(opt);
      });
    }

    function pickVoiceByName(name) {
      return voicesState.voices.find(v => v.name === name) || null;
    }

    function stopAll() {
      speechSynthesis.cancel();
    }

    function speakText(text, { rate=1.05, pitch=1.05, voice=null } = {}) {
      stopAll();
      const chunks = splitIntoChunks(text);
      let i = 0;

      function speakNext() {
        if (i >= chunks.length) return;
        const u = new SpeechSynthesisUtterance(chunks[i]);
        if (voice) u.voice = voice;
        u.lang = (voice && voice.lang) || 'zh-HK';
        u.rate = rate;
        u.pitch = pitch;
        u.onend = () => { i++; speakNext(); };
        speechSynthesis.speak(u);
      }
      speakNext();
    }

    function applyToPage() {
      $('#out1').textContent = $('#input1').value.trim();
      $('#out2').textContent = $('#input2').value.trim();
    }

    function copyText(elId) {
      const text = $(elId).textContent;
      navigator.clipboard.writeText(text);
    }

    function presetProfessional() {
      $('#rate').value = 1.15;
      $('#pitch').value = 1.0;
    }
    function presetWarm() {
      $('#rate').value = 0.92;
      $('#pitch').value = 1.18;
    }

    $('#apply').addEventListener('click', applyToPage);
    $('#stopAll').addEventListener('click', stopAll);
    $('#copy1').addEventListener('click', () => copyText('#out1'));
    $('#copy2').addEventListener('click', () => copyText('#out2'));
    $('#preset1').addEventListener('click', presetProfessional);
    $('#preset2').addEventListener('click', presetWarm);

    $('#play1').addEventListener('click', () => {
      const voice = pickVoiceByName($('#voiceSelect').value);
      speakText($('#out1').textContent, {
        rate: parseFloat($('#rate').value),
        pitch: parseFloat($('#pitch').value),
        voice
      });
    });

    $('#play2').addEventListener('click', () => {
      const voice = pickVoiceByName($('#voiceSelect').value);
      speakText($('#out2').textContent, {
        rate: parseFloat($('#rate').value),
        pitch: parseFloat($('#pitch').value),
        voice
      });
    });

    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    } else {
      $('#voiceSelect').innerHTML = '<option>此瀏覽器不支援語音合成</option>';
    }
    applyToPage();
  </script>
</body>
</html>
